- name: Set up Kubernetes Master
  hosts: master
  gather_facts: yes
  become: yes
  vars:
    kind: master
    public_ip: "{{ groups['master'][0] }}"
    private_ip: "{{ ansible_default_ipv4.address }}"

  roles:
    - common
    - client-tools
    - security
    - kubeconfig
    - bootstrap-controlplane
    - cri
    - prepare-tls-bootstrap-workers
