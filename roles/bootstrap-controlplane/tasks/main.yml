- name: Load certificate vars
  include_vars: "{{ playbook_dir }}/roles/security/vars/main.yml"

- import_tasks: etcd.yml
  when: "'etcd' in components "

- import_tasks: kube-apiserver.yml
  when: "'kube-apiserver' in components "

- import_tasks: kube-controller-manager.yml
  when: "'kube-controller-manager' in components "

- import_tasks: kube-scheduler.yml
  when: "'kube-scheduler' in components "

- import_tasks: kubelet.yml
  when: "'kubelet' in components "

- import_tasks: kube-proxy.yml
  when: "'kube-proxy' in components"
